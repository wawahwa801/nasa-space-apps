# Runs the project's checks on Windows and macOS for every pull request, so a
# change that only breaks on one system is caught before it merges.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No symlinks (they break Windows checkouts, see AGENTS.md)
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" {print $4}')
          if [ -n "$links" ]; then
            echo "::error::Symlinks are not allowed; commit real files instead:"
            echo "$links"
            exit 1
          fi

  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Windows runner keeps Git's default core.autocrlf=true, like a
        # teammate's Windows machine, so line-ending problems show up here.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements.txt -r backend/requirements-dev.txt

      - name: Verify published model checksums
        run: python ml/verify_flex2_models.py

      - name: ML tests
        run: python -m unittest discover -s ml

      - name: Physics tests
        run: |
          python -m unittest discover -s physics-flex2
          python -m unittest discover -s physics-prototype

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Fire dashboard tests
        run: node --test "fire-dashboard/tests/*.cjs"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Feature retrieval data check
        run: node frontend/scripts/check-feature-retrieval.mjs
